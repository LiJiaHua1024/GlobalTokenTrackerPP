name: Build on Push (Installer & Portable)

on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - '**/*.md'
      - 'README*'
      - 'docs/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - '**/*.md'
      - 'README*'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ci-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  build:
    name: Build Installer and Portable Zip
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1

      # dtolnay/rust-toolchain ignores rust-toolchain.toml when no toolchain
      # input is given and installs latest stable, so read the pin out of the
      # file and pass it explicitly. That keeps this the single source of truth.
      - name: Resolve pinned Rust toolchain
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\(.*\)".*$/\1/p' rust-toolchain.toml | tr -d '\r')
          [ -n "$version" ] || { echo "no channel pinned in rust-toolchain.toml" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # version pinned in rust-toolchain.toml
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
          components: clippy

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          # Pinned to the SDK the maintainer builds against. A floating stable
          # let new Dart analyzer releases change `flutter analyze` results and
          # fail builds that changed no Dart code.
          flutter-version: 3.47.5
          cache: true

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Rust check & Clippy
        shell: bash
        run: |
          cargo check --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        shell: bash
        run: cargo test --workspace

      # The FFI integration test loads the DLL from ../target/debug, which
      # does not exist yet: package.ps1 builds it later, after flutter test.
      - name: Build FFI DLL for integration tests
        shell: bash
        run: cargo build -p globaltokentracker-ffi

      - name: Flutter analyze
        working-directory: flutter_ui
        run: flutter analyze lib/

      - name: Flutter tests
        working-directory: flutter_ui
        run: flutter test

      - name: Build and Package (Installer + Portable Zip)
        id: package
        shell: pwsh
        run: |
          # Stay in pwsh. Shelling down to Windows PowerShell 5.1 made the
          # installer scripts decode against the machine ANSI codepage instead
          # of UTF-8, which corrupted their em dashes into a parse error.
          pwsh -ExecutionPolicy Bypass -File installer/package.ps1

          $installer = Get-ChildItem dist\GlobalTokenTrackerPP-Setup-*-win-x64.exe | Select-Object -First 1
          $portable  = Get-ChildItem dist\GlobalTokenTrackerPP-*-windows-x64.zip | Select-Object -First 1

          if (-not $installer) { throw "Installer executable not found in dist/" }
          if (-not $portable)  { throw "Portable zip not found in dist/" }

          $installerSha = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          $portableSha  = (Get-FileHash $portable.FullName -Algorithm SHA256).Hash.ToLower()
          $installerMb  = [math]::Round($installer.Length / 1MB, 2)
          $portableMb   = [math]::Round($portable.Length / 1MB, 2)

          "### 📦 Automated Build Artifacts" >> $env:GITHUB_STEP_SUMMARY
          "- **Commit**: ``${{ github.sha }}``" >> $env:GITHUB_STEP_SUMMARY
          "- **Branch**: ``${{ github.ref_name }}``" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "| Artifact | Filename | Size | SHA-256 |" >> $env:GITHUB_STEP_SUMMARY
          "| :--- | :--- | :--- | :--- |" >> $env:GITHUB_STEP_SUMMARY
          "| **安装包 (Setup)** | ``$($installer.Name)`` | $installerMb MB | ``$installerSha`` |" >> $env:GITHUB_STEP_SUMMARY
          "| **便携版 (Portable Zip)** | ``$($portable.Name)`` | $portableMb MB | ``$portableSha`` |" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload Installer Asset
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: GlobalTokenTrackerPP-Setup-win-x64
          path: dist/GlobalTokenTrackerPP-Setup-*-win-x64.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload Portable Zip Asset
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: GlobalTokenTrackerPP-Portable-win-x64
          path: dist/GlobalTokenTrackerPP-*-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
