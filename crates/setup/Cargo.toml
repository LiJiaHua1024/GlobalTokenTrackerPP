[package]
name = "globaltokentracker-setup"
version.workspace = true
edition.workspace = true
description = "GlobalTokenTracker self-extracting installer (per-user, no admin)"

[lints]
workspace = true

[[bin]]
name = "globaltokentracker-setup"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
ureq = "3.4.2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Com", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_UI_Input_KeyboardAndMouse"] }
winreg = "0.55"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[build-dependencies]
winresource = "0.1"
