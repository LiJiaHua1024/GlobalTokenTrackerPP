name: globaltokentracker_ui
description: "GlobalTokenTracker++ Material Design 3 Desktop UI"
publish_to: 'none'
version: 1.8.0+16

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  fl_chart: ^0.70.0
  provider: ^6.1.2
  intl: ^0.20.2
  ffi: ^2.1.3
  animations: ^2.0.11
  window_manager: ^0.5.2
  pasteboard: ^0.5.0
  file_picker: ^13.1.0
  crypto: ^3.0.3
  html: ^0.15.7
  markdown: ^7.3.1
  flutter_markdown_plus: ^1.0.12
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    # Bitmap-inspired monospace standing in for the ROM font a thermal printer
    # burns into its own print head. SIL OFL 1.1 — see assets/fonts/Doto-OFL.txt.
    - family: Doto
      fonts:
        - asset: assets/fonts/Doto.ttf
